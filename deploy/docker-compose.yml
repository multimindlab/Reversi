# Reversi server on PostgreSQL. From the repo root:
#   node packages/connectors/dist/main.js manifests fs --format yaml > examples/gateway/manifests/fs.yaml   (after npm run build)
#   cp deploy/keys.example.json deploy/keys.json     # then replace the placeholder hashes (see the comments in the file)
#   POSTGRES_PASSWORD=$(openssl rand -hex 16) docker compose -f deploy/docker-compose.yml up --build
# The console is off by default; this file turns on the login console at http://127.0.0.1:7421/console (paste an API key). Put TLS in front of it for anything beyond localhost.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reversi
      POSTGRES_DB: reversi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reversi"]
      interval: 5s
      retries: 10

  reversi:
    build:
      context: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVERSI_MANIFESTS: /config/manifests
      REVERSI_KEYS: /config/keys.json
      REVERSI_POLICY: /config/policy.yaml
      REVERSI_STORE: postgres
      REVERSI_DATABASE_URL: postgres://reversi:${POSTGRES_PASSWORD}@postgres:5432/reversi
      REVERSI_LOG: json
      REVERSI_CONSOLE: login
    volumes:
      - ./keys.json:/config/keys.json:ro
      - ../examples/gateway/manifests:/config/manifests:ro
      - ../examples/gateway/policy.yaml:/config/policy.yaml:ro
    ports:
      - "127.0.0.1:7421:7421"

volumes:
  pgdata:
