{{- if and .Values.store.persistence.enabled (ne .Values.store.kind "postgres") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "reversi.name" . }}-data
  labels: {{- include "reversi.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.store.persistence.storageClass }}
  storageClassName: {{ .Values.store.persistence.storageClass }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.store.persistence.size }} } }
{{- end }}
---
{{- if .Values.registry.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "reversi.name" . }}-state
  labels: {{- include "reversi.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.registry.persistence.storageClass }}
  storageClassName: {{ .Values.registry.persistence.storageClass }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.registry.persistence.size }} } }
{{- end }}
